### Shadow Residual answerability adapter on granite-4.2-3b -- FULL run.
###
### Intrinsic: answerability
### Model:     ibm-granite/granite-4.2-3b
### Type:      Shadow Residual (cross_stream + shared base-only K/V, always-active
###            plain LoRA -- no gating)
###
### Runs the full recipe: 3 epochs, effective batch 8. The raw shards yield
### ~14.3k rows, which is under the 40k subsample cap, so the subsample is a
### no-op; the 0.1 split gives ~12.8k train / ~1.4k val, and dropping rows over
### max_length (measured at 8.0% / 7.0%) leaves ~11.8k / ~1.3k. That is ~1,480
### steps per epoch, ~4,430 total.
###
### Budget at least ~9h40m on 1 GPU -- that is what the prior successful 3b run
### took, and it peaked at only 8.6 GB host RAM of the 128 Gi requested. Expect
### somewhat longer here: that run had gradient checkpointing effectively off
### (invocation_tokens forced it off), whereas this config enables it, trading
### wall-clock for activation memory. Long runs are not a problem on this queue
### -- a 3b 10-epoch run has completed at 24h35m and an 8b at ~35h.
###
### The smoke variant lives on branch gb/sr-4.2-smoke-test, not here. If you want
### a cheap pipeline check before spending ~6 h, copy this file and add
### SMOKE_MAX_ROWS=5000 / SMOKE_SUBSAMPLE=2000 / SMOKE_MAX_STEPS=20 to env.
### Never run two builds concurrently while the conda env is still cold -- they
### share CONDA_PKGS_DIRS and have been observed corrupting each other.
###
### Submit to space `public` (where steps/custom_code_lsf and
### environments/bluevela live):
###   gb build validate --filename gb/sr-answerability-4.2-3b.yaml --space public --skip-version-check
###   gb build start    --filename gb/sr-answerability-4.2-3b.yaml --space public --skip-version-check
###
### github_ref MUST be an immutable full SHA: the ref resolves when the LSF job
### STARTS, so a push to the branch while this sits in PEND would change what it
### clones.

granite.build:
  name: sr-answerability-4.2-3b
  targets:
    train:
      # Required. Omitting it is the classic first-attempt failure.
      environment_uri: space://environments/bluevela
      # Without this the step still succeeds and still writes checkpoints, but
      # they live only under /proj/.../builds/llm-build-<id>/... and
      # build_lineage returns []. Registering the fileset makes the adapter a
      # first-class artifact.
      outputs:
        sr-answerability-4.2-3b:
          uri: lh://{{ space.variables.DEFAULT_LH_ENVIRONMENT }}/{{ space.variables.DEFAULT_LH_NAMESPACE }}/filesets/{{ space.variables.DEFAULT_LH_FILESET_TABLE }}/sr-answerability-4.2-3b-{{ run_metadata.targetsteprun_id | short_hash }}/1/
          type: fileset
      steps:
        - step_uri: "space://steps/custom_code_lsf"
          config:
            compute_config:
              num_nodes: 1              # schema pins this to 1
              num_gpus_per_node: 1
              num_cpus_per_node: 8
              total_memory_per_node: 128Gi
            lsf:
              # Declaring this block REPLACES all 5 step defaults and the
              # validator hard-errors at submit on any that go missing, so all 5
              # are re-listed verbatim. WORKLOAD_GIT_PAT is the addition: the step
              # drops GB_SDK_GIT_PAT before the workload phase, and
              # gb/byoc_run.sh needs a GHE PAT there to clone
              # intrinsics_training and `git lfs pull` the training data.
              secrets:
                secret_names_to_use_as_env_variable:
                  - { env_name: GB_SDK_GIT_PAT,         secret_name: GITHUB_IBM_PAT }
                  - { env_name: CLEARML_API_HOST,       secret_name: CLEARML_API_HOST }
                  - { env_name: CLEARML_API_ACCESS_KEY, secret_name: CLEARML_API_ACCESS_KEY }
                  - { env_name: CLEARML_API_SECRET_KEY, secret_name: CLEARML_API_SECRET_KEY }
                  - { env_name: HF_TOKEN,               secret_name: HF_TOKEN }
                  - { env_name: WORKLOAD_GIT_PAT,       secret_name: GITHUB_IBM_PAT }
              # No bsub queue/group override: bluevela already defaults to queue
              # `normal` / group `grp_granite_dot_build`, and the flat `lsf.queue`
              # form seen in some examples is a silent no-op.
            byoc_config:
              # Public github.com, not GHE -- CONFIRMED WORKING, not assumed.
              # The step's resolve_ref.sh builds
              # https://${GB_SDK_GIT_PAT}@${github_url}.git, interpolating the GHE
              # token as the username; github.com ignores an invalid credential for
              # public-repo reads, so that is harmless. The config schema accepts
              # any host.tld/path, and builds f8bfeb40 / 0f7a356d both cloned this
              # repo from github.com on a BlueVela compute node successfully.
              github_url: "github.com/touma-I/shadow-residual"
              # MUST be an immutable full SHA on THIS branch (the gb/ layout). The
              # ref resolves when the LSF job STARTS, so a branch name would let a
              # push mid-PEND change what gets cloned. Repin after any code change.
              github_ref: "50602e399270eaa88cc27fbafc25407b331cf68c"
              conda_lockfile_path: "gb/environment.yml"
              # The leading `ls` is a fail-fast guard: it runs in seconds during
              # phase 3, before the ~50-minute conda env build, so a clone that
              # landed without the BYOC files fails immediately instead of an hour
              # in. Keep it from the FIRST build -- setup_command is part of the
              # env cache key, so adding it later buys a fresh env build.
              setup_command: >-
                ls -la gb/byoc_run.sh gb/prepare_answerability_jsonl.py
                gb/sr-train-config-4.2-3b.yaml >/dev/null &&
                pip install --no-cache-dir -r gb/requirements-byoc.txt
              # NOTE: moving these files under gb/ changed setup_command, which is
              # part of the env cache key, so the first build on this layout pays a
              # one-time ~50-minute conda env rebuild. The file CONTENTS are
              # unchanged, so nothing else about the env differs.
              # Cache key = lockfile + setup_command + these files' contents.
              # pyproject.toml is deliberately absent: we never install it, so
              # including it would invalidate the env on unrelated edits.
              dependency_files:
                - "gb/environment.yml"
                - "gb/requirements-byoc.txt"
              start_command: "bash gb/byoc_run.sh"
              dir_to_save: "."
              output_name: "sr-answerability-4.2-3b"
              env:
                WANDB_MODE: "disabled"
                HF_HOME: "/proj/data-eng/llmb-read-write/hfcache/"
                # Variable sequence lengths at max_length 8192 fragment the allocator.
                PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
                # Progress bars must stay off: a tqdm bar is one giant
                # CR-delimited "line", and gbserver's log tailer bkills the job
                # once a line exceeds 64 KiB. The wrapper defaults this too; set
                # here as well so it is visible in build_describe.
                TQDM_DISABLE: "1"
                SR_CONFIG: "gb/sr-train-config-4.2-3b.yaml"
                # A ref NAME, not a SHA: the wrapper uses `git clone --branch`,
                # which cannot take a raw commit id. This tag is the fork's main
                # immediately after the 2026-09-28 upstream sync.
                INTRINSICS_REF: "sr-run-2026-09-28"
                EVAL_BATCH_SIZE: "4"
